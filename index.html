<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte Cour Dillon - APC31</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">

<style>
html, body { margin:0; height:100%; }
#map { height:100vh; width:100%; }
.point-div {
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  pointer-events:auto;
}
.point-div .material-icons {
  font-size:32px; /* taille icône fixe */
}
.point-div span.name {
  background: rgba(255,255,255,0.9);
  padding: 2px 6px;
  border-radius: 6px;
  font-size:14px;
  margin-top:2px;
  max-width: 120px;
  word-wrap: break-word;
}
.leaflet-popup-content { font-size: 14px; }
.icon-picker {
  display:flex;
  flex-wrap: wrap;
  max-height:300px;
  overflow-y:auto;
}
.icon-picker span {
  cursor:pointer;
  font-size:32px;
  margin:3px;
}
.icon-picker span:hover { transform: scale(1.3); }
.color-picker {
  margin:5px 0;
}
</style>
</head>
<body>
<div id="map"></div>

<script>
// === FIREBASE ===
const firebaseConfig = {
  apiKey: "AIzaSyAEHQ9-vxIgvYL2useK7ThkSkhavvwyISg",
  authDomain: "plan-cour-dillon.firebaseapp.com",
  databaseURL: "https://plan-cour-dillon-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "plan-cour-dillon",
  storageBucket: "plan-cour-dillon.firebasestorage.app",
  messagingSenderId: "859820983805",
  appId: "1:859820983805:web:1a6c31e8bc10953c390594",
  measurementId: "G-3D43TV1R8Q"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// === Leaflet ===
const w = 17730, h = 6012;
const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: -5,
  maxZoom: 5,
  scrollWheelZoom:true
});
const imageUrl = 'https://i.postimg.cc/3rvJ7k3G/Cour-Dillon.png';
const bounds = [[0,0],[h,w]];
L.imageOverlay(imageUrl,bounds).addTo(map);
map.fitBounds(bounds);

// === Icônes DPS ===
const dpsIcons = [
  {name:"Ambulance", icon:"ambulance"},
  {name:"Croix de vie", icon:"local_hospital"},
  {name:"Maison / PC", icon:"home"},
  {name:"groupe", icon:"group"},
  {name:"Poste de secours", icon:"healing"},
  {name:"Véhicule", icon:"directions_car"},
  {name:"Bateau", icon:"directions_boat"},
];

// === Création d’un divIcon avec nom sous l’icône ===
function createDivIcon(iconName,name,color="#d32f2f"){
  return L.divIcon({
    className:'point-div',
    html:`<div><span class="material-icons" style="color:${color}">${iconName}</span><span class="name">${name}</span></div>`,
    iconSize:[40,40],
    iconAnchor:[20,40],
    popupAnchor:[0,-40]
  });
}

// === Charger les points ===
const markersRef = db.ref('markers');
let leafletMarkers={};

markersRef.on('value', snapshot=>{
  const data = snapshot.val() || {};
  Object.values(leafletMarkers).forEach(m=>map.removeLayer(m));
  leafletMarkers={};
  Object.entries(data).forEach(([id,marker])=>{
    const m=L.marker(marker.latlng,{icon:createDivIcon(marker.icon,marker.name,marker.color||'#d32f2f')}).addTo(map);
    const popupContent=document.createElement('div');
    popupContent.innerHTML=`<b>${marker.name}</b><br><button id="del-${id}">Supprimer</button>`;
    m.bindPopup(popupContent);
    leafletMarkers[id]=m;
    popupContent.querySelector(`#del-${id}`).addEventListener('click',()=>{
      db.ref('markers/'+id).remove();
      map.closePopup();
    });
  });
});

// === Ajouter un point au clic ===
map.on('click', e=>{
  const name = prompt("Nom du point (ex: Poste de secours, PC...)");
  if(!name) return;

  // Popup de sélection DPS
  const popupContent=document.createElement('div');
  popupContent.innerHTML='<b>Choisissez une icône DPS :</b><br>';
  const iconPicker=document.createElement('div');
  iconPicker.className='icon-picker';

  dpsIcons.forEach(dps=>{
    const span=document.createElement('span');
    span.className='material-icons';
    span.textContent=dps.icon;
    span.title=dps.name;
    span.addEventListener('click',()=>{
      const colorInput=document.getElementById('iconColor');
      const color=colorInput?colorInput.value:'#d32f2f';
      const newMarker={latlng:e.latlng,name:name,icon:dps.icon,color:color};
      db.ref('markers').push(newMarker);
      map.closePopup();
    });
    iconPicker.appendChild(span);
  });

  popupContent.appendChild(iconPicker);

  // Choix couleur
  const colorLabel=document.createElement('div');
  colorLabel.className='color-picker';
  colorLabel.innerHTML='Choisissez couleur: <input type="color" id="iconColor" value="#d32f2f">';
  popupContent.appendChild(colorLabel);

  L.popup().setLatLng(e.latlng).setContent(popupContent).openOn(map);
});

// === Taille fixe au zoom ===
map.on('zoom', ()=>{
  Object.values(leafletMarkers).forEach(marker=>{
    const zoomScale = 1/Math.pow(2,map.getZoom());
    const el=marker.getElement();
    if(el) el.style.transform=`scale(${zoomScale})`;
  });
});
</script>
</body>
</html>
